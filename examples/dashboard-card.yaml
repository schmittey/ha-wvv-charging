# Example Lovelace dashboard card for the WVV Charging integration.
#
# Entities are named after each station's street address (e.g.
# "Rüdigerstr. 3"), since that's what WVV's own data gives you to go on -
# the raw API doesn't provide readable station names. A handful of
# stations share the exact same address (e.g. large parking garages with
# many charge points); those get a trailing "#2", "#3", ... to stay
# unique. Check Settings -> Devices & Services -> WVV Charging for the
# exact entity ids of the stations you picked, then adjust below.

- type: entities
  title: WVV Ladestation – Rüdigerstraße
  entities:
    - entity: sensor.rudigerstr_3_free_points
      name: Freie Ladepunkte
    - entity: sensor.rudigerstr_3_status
      name: Status
    - entity: binary_sensor.rudigerstr_3_any_free
      name: Komplett belegt

# The "any_free" binary sensor is used on the map because it's the one
# with a colored icon: green while a point is free, red once it's full.
- type: map
  title: WVV Ladestationen in der Nähe
  entities:
    - entity: binary_sensor.rudigerstr_3_any_free
    - entity: binary_sensor.estenfelder_strasse_37_any_free
  default_zoom: 13
